<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>法律证据保管</title>
<style>
body{font:15px system-ui;max-width:1080px;margin:24px auto;padding:0 16px;color:#222}
h1{font-size:22px}h2{font-size:17px;margin:0 0 8px}
select,input,button{padding:6px;margin:4px;font:inherit}
.panel{border:1px solid #bbb;padding:14px;border-radius:8px;margin-bottom:16px}
.card{border:1px solid #ccc;border-radius:8px;padding:12px;margin:10px 0}
.card.frozen{border-color:#c0392b;background:#fdf3f2}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;background:#eee;margin:2px;font-size:13px}
.badge.ok{background:#dff0d8}.badge.bad{background:#f2dede}.badge.hold{background:#f5c6cb}
pre{background:#f4f4f4;padding:10px;white-space:pre-wrap;max-height:300px;overflow:auto}
.err{color:#c0392b}.pass{color:#1e7e34}
table{border-collapse:collapse;margin-top:6px}td,th{border:1px solid #ddd;padding:3px 8px;font-size:13px}
.src{font-weight:600}
</style></head>
<body>
<h1>法律证据保管与流转</h1>
<div class="panel">
  身份 <select id="user"><option>custodian1</option><option>custodian2</option><option>analyst1</option><option>auditor1</option><option>outsider</option></select>
  案件 <input id="case" value="1" size="5">
  <button onclick="loadReport()">生成保管报告</button>
  <span id="summary"></span>
</div>
<div class="panel" id="opPanel">
  <h2>证据操作（可直接尝试，冻结中的操作会返回具体拒绝原因）</h2>
  证据 #<input id="opEid" size="6">
  <select id="op">
    <option value="open">开箱</option>
    <option value="transfer">移交</option>
    <option value="derive">派生</option>
    <option value="release">释放</option>
    <option value="hold_set">设置法律保留</option>
    <option value="hold_clear">解除法律保留</option>
  </select>
  <div id="fields"></div>
  <button onclick="runOp()">执行操作</button>
  <pre id="opResult">尚未执行</pre>
</div>
<div id="report"></div>
<script>
const $=id=>document.getElementById(id);
const OP_LABEL={open:"开箱",transfer:"移交",derive:"派生",release:"释放"};
const FIELDS={
  open:[["location","开箱地点"],["note","备注"]],
  transfer:[["to_person","接收人"],["location","保管位置"],["note","备注"]],
  derive:[["method","分析方法"],["label","子证据标签"],["filename","文件名"],["content_b64","内容(Base64)"]],
  release:[["recipient","接收方"],["note","备注"]],
  hold_set:[["reason","保留原因（至少 5 字）"]],
  hold_clear:[["reason","解除原因（至少 5 字）"]],
};
function renderFields(){
  $("fields").innerHTML=FIELDS[$("op").value].map(([k,ph])=>`<input data-k="${k}" placeholder="${ph}" size="22">`).join("");
}
$("op").onchange=renderFields;renderFields();
function pick(eid,op){
  $("opEid").value=eid;$("op").value=op;renderFields();
  $("opPanel").scrollIntoView({behavior:"smooth"});
  const f=$("fields").querySelector("input");if(f)f.focus();
}
async function runOp(){
  const eid=$("opEid").value.trim(),op=$("op").value,box=$("opResult");
  const body={};$("fields").querySelectorAll("input").forEach(i=>body[i.dataset.k]=i.value);
  let url;
  if(op==="hold_set"||op==="hold_clear"){url=`/api/evidence/${eid}/hold`;body.hold=op==="hold_set";}
  else url=`/api/evidence/${eid}/${op}`;
  box.className="";box.textContent="执行中…";
  try{
    const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","X-User-Id":$("user").value},body:JSON.stringify(body)});
    const data=await r.json();
    if(r.ok){box.className="pass";box.textContent=`成功（HTTP ${r.status}）\n`+JSON.stringify(data,null,2);}
    else{box.className="err";box.textContent=`被拒绝（HTTP ${r.status}）：${data.error?data.error.message:"未知错误"}\n错误码：${data.error?data.error.code:"-"}`;}
  }catch(e){box.className="err";box.textContent="请求失败："+e;}
  loadReport();
}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function srcText(s){
  if(!s)return"无";
  if(s.type==="direct")return`本证据 #${s.evidence_id} 被直接设置法律保留`;
  return"继承自上游证据 "+s.ancestors.map(i=>"#"+i).join("、")+" 的法律保留";
}
async function loadReport(){
  const r=await fetch(`/api/cases/${$("case").value}/report`,{headers:{"X-User-Id":$("user").value}});
  const data=await r.json();
  if(!r.ok){$("summary").textContent="";$("report").innerHTML=`<pre class="err">报告加载失败（HTTP ${r.status}）：${data.error?data.error.message:"未知错误"}</pre>`;return;}
  $("summary").textContent=`整体完整性：${data.overall_integrity_valid?"有效":"失效"}，证据 ${data.evidence_count} 件，生成于 ${data.generated_at}`;
  $("report").innerHTML=data.evidence.map(e=>`
   <div class="card ${e.frozen?"frozen":""}">
    <div><b>#${e.id} ${esc(e.label)}</b>（${esc(e.filename)}）
     状态 <span class="badge">${e.status}</span>
     保管人 <span class="badge">${esc(e.current_custodian)}</span>
     哈希 <span class="badge ${e.hash_valid?"ok":"bad"}">${e.hash_valid?"有效":"失效"}</span>
     事件链 <span class="badge ${e.chain_valid?"ok":"bad"}">${e.chain_valid?"有效":"断裂"}</span>
     ${e.legal_hold?'<span class="badge hold">法律保留中</span>':""}
    </div>
    <div>冻结来源：<span class="src">${e.frozen?srcText(e.hold_source):"无（未冻结）"}</span></div>
    <div>可办理操作：${e.allowed_operations.length?e.allowed_operations.map(o=>`<span class="badge ok">${OP_LABEL[o]}</span>`).join(""):'<span class="badge bad">无（已全部暂停）</span>'}</div>
    <div>
      ${["open","transfer","derive","release"].map(o=>`<button onclick="pick(${e.id},'${o}')">${OP_LABEL[o]}</button>`).join("")}
      <button onclick="pick(${e.id},'hold_set')">设置保留</button>
      <button onclick="pick(${e.id},'hold_clear')">解除保留</button>
    </div>
    ${e.derivatives.length?`<div>衍生证据：${e.derivatives.map(d=>`<span class="badge">#${d.child_evidence_id} ${esc(d.method)}</span>`).join("")}</div>`:""}
    <details><summary>保管事件链（${e.events.length} 条）</summary>
     <table><tr><th>序</th><th>事件</th><th>操作人</th><th>从</th><th>到</th><th>位置</th><th>备注</th><th>时间</th></tr>
     ${e.events.map(v=>`<tr><td>${v.sequence}</td><td>${v.event_type}</td><td>${esc(v.actor_id)}</td><td>${esc(v.from_person||"")}</td><td>${esc(v.to_person||"")}</td><td>${esc(v.location)}</td><td>${esc(v.note)}</td><td>${v.created_at}</td></tr>`).join("")}</table>
    </details>
   </div>`).join("");
}
loadReport();
</script></body></html>
